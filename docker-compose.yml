services:
  traefikshaper:
    # Prebuilt image from GitHub Container Registry
    image: ghcr.io/kkawkk/traefikshaper:latest
    # Or build it yourself from this repository instead:
    # build: .
    # pull_policy: build
    container_name: traefikshaper   # must match the forwardAuth address in traefik-forwardauth.yml
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - 5000   # reachable by Traefik on the shared network only; never publish with ports:
    # networks: [proxy]   # must share a network with Traefik
    environment:
      - APPURL=https://DOMAIN
      - GRANT_HTTP_ENDPOINT=/UNIQUEURL
      - IPSTRATEGY_DEPTH=0 # use 1 if traefik runs behind another proxy (e.g. CloudFlare); see traefik-forwardauth.yml
      - EXPIRATION_TIME=43200
      # Removed blanket 172.16.0.0/12 (every Docker network). If something internal
      # breaks, add only its specific address, e.g. WHITELISTED_IPS=172.18.0.1/32
      # - WHITELISTED_IPS=172.16.0.0/12
      - APPRISE_NOTIFICATION_URL=tgram://SECRET
      - ALLOW_SERVER_IP=True   # always allow this server's own dynamic public IP
      # - ALLOW_PRIVATE_APPROVALS=False  # True only if clients legitimately arrive from private IPs (e.g. LAN/VPN)
      # Optional (defaults shown):
      # - SERVER_IP_CHECK_URLS=https://api.ipify.org,https://ipv4.icanhazip.com,https://checkip.amazonaws.com,https://ipinfo.io/ip
      # - SERVER_IP_MIN_AGREE=2        # services that must return the same IP
      # - SERVER_IP_CHECK_INTERVAL=60  # seconds
      # Country + ASN in notifications: downloads free DB-IP Lite databases on startup and
      # refreshes them monthly (attribution to DB-IP is shown on the approval page).
      - GEOIP_DOWNLOAD=True
      # - GEOIP_DIR=/tmp/geoip   # mount a volume here to keep the files across restarts
      # Or use your own .mmdb files instead (mount ./geoip:/geoip:ro below):
      # - GEOIP_COUNTRY_DB=/geoip/dbip-country-lite.mmdb
      # - GEOIP_ASN_DB=/geoip/dbip-asn-lite.mmdb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # - ./geoip:/geoip:ro   # only for your own GEOIP_COUNTRY_DB / GEOIP_ASN_DB files
