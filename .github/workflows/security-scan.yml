name: Security scan

# Scans the released image (:latest) with Trivy and reports findings in the
# repository's Security tab (code scanning). Alerts close automatically once a
# later scan no longer finds them. Fixes ship with the next release: merge the
# Dependabot PRs, test :edge, tag a version.
on:
  schedule:
    - cron: '0 5 * * 1'      # Mondays 05:00 UTC
  workflow_dispatch:
  workflow_run:              # right after a release has been published
    workflows: [Build and publish image]
    types: [completed]

permissions: {}

jobs:
  trivy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning

    steps:
      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      # Pinned by commit SHA: in March 2026 most trivy-action tags were
      # force-pushed with malicious code (CVE-2026-33634). v0.36.0 is an
      # immutable release published after the incident. The image is public,
      # so no registry credentials are handed to the scanner.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ steps.image.outputs.ref }}
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-latest
